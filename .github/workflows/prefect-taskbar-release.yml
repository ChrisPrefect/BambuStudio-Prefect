name: Prepare or publish verified Prefect Taskbar .4

on:
  push:
    branches: [delivery/windows]
    paths:
      - .github/workflows/prefect-taskbar-release.yml
      - delivery/taskbar-release/**

permissions:
  contents: write
  actions: read

concurrency:
  group: prefect-taskbar-release
  cancel-in-progress: false

jobs:
  deliver:
    if: github.repository == 'ChrisPrefect/BambuStudio-Prefect' && github.ref == 'refs/heads/delivery/windows'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: delivery/taskbar-release
      - name: Run network-free release regression tests
        run: python3 -m unittest discover -s delivery/taskbar-release -p 'test_*.py' -v
      - name: Verify pinned inputs and prepare draft or publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 delivery/taskbar-release/release.py --report taskbar-release-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: Prefect-Taskbar-release-verification
          path: taskbar-release-verification.json
          if-no-files-found: error
          retention-days: 90
